<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ .Site.Params.description }}">
    <title>{{ .Title }} | {{ .Site.Title }}</title>
    <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h1 class="sidebar-title">
                    <i class="fas fa-cube"></i>
                    <span class="sidebar-title-text">client-go</span>
                </h1>
                <button id="theme-toggle" class="icon-btn" title="Toggle theme">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
            
            <nav class="sidebar-nav">
                {{ $currentPage := . }}
                {{ range .Site.Menus.main }}
                <a href="{{ .URL | relURL }}" class="nav-link {{ if eq $currentPage.RelPermalink .URL }}active{{ end }}">
                    <span class="nav-text">{{ .Name }}</span>
                </a>
                {{ end }}
            </nav>
            
            <div class="sidebar-footer">
                <a href="{{ .Site.Params.github }}" target="_blank" class="github-link">
                    <i class="fab fa-github"></i>
                    <span class="nav-text">GitHub</span>
                </a>
            </div>
        </aside>

        <!-- Resize Handle -->
        <div id="resize-handle" class="resize-handle"></div>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-header">
                <button id="menu-toggle" class="icon-btn" title="Toggle menu">
                    <i class="fas fa-bars"></i>
                </button>
                <h1 class="page-title">{{ .Title }}</h1>
            </div>
            
            <div class="content-body">
                {{ block "main" . }}{{ end }}
            </div>
            
            <footer class="content-footer">
                <p>&copy; {{ now.Year }} The Kubernetes Authors | <a href="https://www.apache.org/licenses/LICENSE-2.0">Apache License 2.0</a></p>
            </footer>
        </main>
    </div>

    <script src="{{ "js/main.js" | relURL }}"></script>
</body>
</html>
